<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">

    <link rel="icon" type="image/png" href="img/favicon.png">

    <meta property="og:image" content="https://tornado-fairs.com/img/favicon.png">
    <meta property="og:title" content="">
    <meta property="og:description" content="">

    <title></title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container">

        <nav class="navbar">
            <div class="nav-brand">
                <img src="img/logo.svg" alt="" class="logo" data-i18n-alt="logoAlt">
            </div>
            <div class="lang-switcher" id="lang-switcher"></div>
        </nav>

        <main>

            <!-- Videos -->
            <section class="video-section">
                <h2 data-i18n="videosHeading"></h2>

                <div class="video-container">

                    <div class="video-wrapper">
                        <div class="video-card">

                            <video controls="true" controlsList="nodownload" preload="auto"
                                poster="./img/alaraby-poster.jpeg"
                                src="https://ik.imagekit.io/elarabykit/Tornadoglobal/DocumentryEnglish.mp4?tr=orig"
                                type="video/mp4">
                                <span data-i18n="videoUnsupported"></span>
                            </video>

                            <div class="video-info">
                                <h3 data-i18n="video1Title"></h3>
                                <p class="video-description" data-i18n="video1Desc"></p>
                            </div>

                        </div>
                    </div>

                    <div class="video-wrapper">
                        <div class="video-card">

                            <video controls="true" controlsList="nodownload" preload="auto"
                                poster="./img/tornedo-poster.jpeg"
                                src="https://ik.imagekit.io/elarabykit/Tornadoglobal/Tornado_Film_English_Mobile.mp4?tr=orig"
                                type="video/mp4">
                                <span data-i18n="videoUnsupported"></span>
                            </video>

                            <div class="video-info">
                                <h3 data-i18n="video2Title"></h3>
                                <p class="video-description" data-i18n="video2Desc"></p>
                            </div>

                        </div>
                    </div>

                </div>
            </section>

            <!-- Official Website -->
            <section class="frame-section">
                <a href="" target="_blank" class="frame-link" data-i18n-aria="frameLinkAria"
                    data-i18n-href="frameLinkHref">

                    <img src="" alt="" class="frame-image" data-i18n-src="frameImgSrc" data-i18n-alt="frameImgAlt">

                </a>
            </section>

            <!-- Instagram -->
            <section class="instagram-section">
                <a href="" target="_blank" rel="noopener noreferrer" class="instagram-link"
                    data-i18n-aria="instaLinkAria" data-i18n-href="instaLinkHref">

                    <img src="" alt="" class="instagram-image" data-i18n-src="instaImgSrc" data-i18n-alt="instaImgAlt">

                </a>
            </section>

            <!-- Product Catalog -->
            <section class="pdf-section">

                <h2 data-i18n="catalogHeading"></h2>

                <div class="pdf-container">

                    <h4 data-i18n="catalogSubheading"></h4>

                    <p data-i18n="catalogDesc"></p>

                    <a href="" target="_blank" download="" class="pdf-link" data-i18n-href="catalogPdfHref"
                        data-i18n-download="catalogPdfDownload" data-i18n-aria="catalogBtnAria">

                        <i class="fas fa-file-pdf" aria-hidden="true"></i>

                        <span data-i18n="catalogBtnText"></span>

                        <span class="sr-only" data-i18n="catalogSrOnly"></span>

                        <i class="fas fa-download" aria-hidden="true"></i>

                    </a>

                </div>
            </section>

        </main>

        <!-- Footer -->
        <footer>

            <div class="footer-links">

                <a href="" target="_blank" data-i18n-href="footerLegalHref" data-i18n="footerLegalNotice"></a>

                <a href="" target="_blank" data-i18n-href="footerProcessingHref" data-i18n="footerProcessingRecord"></a>

            </div>

            <p class="copyright" data-i18n="footerCopyright"></p>

        </footer>

    </div>

    <script type="module" src="i18n.js"></script>
</body>

</html>
